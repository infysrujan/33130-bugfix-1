<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1,  minimal-ui, user-scalable=no"/>
<link rel="preload" href="/fonts/icomoon.woff" as="font" type="font/woff" crossorigin>
<script nonce="aem">
  (() => {
    const globalStyles = document.createElement('link');
    globalStyles.rel = 'stylesheet';
    globalStyles.href = '/styles/styles.css';
    globalStyles.type = 'text/css';
    document.head.append(globalStyles);
  })();
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>
<script nonce="aem" src="/scripts/scripts.js" type="module"></script>
<noscript><link rel="stylesheet" href="/styles/styles.css"/></noscript>

<style>body{display:none;margin:0}body.appear{display:block}</style>
<link rel="preconnect" href="https://edge.bangkokbank.com"/>

<script nonce="aem">
  (() => {
    if (new URLSearchParams(window.location.search).has('martech')) {
      return;
    }
    const loadMartech = () => {
      const preloadIndex = document.createElement('link');
      preloadIndex.rel = 'preload';
      preloadIndex.as = 'script';
      preloadIndex.crossOrigin = 'anonymous';
      preloadIndex.href = '/plugins/martech/src/index.js';

      const preloadAlloy = document.createElement('link');
      preloadAlloy.rel = 'preload';
      preloadAlloy.as = 'script';
      preloadAlloy.crossOrigin = 'anonymous';
      preloadAlloy.href = '/plugins/martech/src/alloy.min.js';

      document.head.appendChild(preloadIndex);
      document.head.appendChild(preloadAlloy);

      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/scripts/gtm-martech.js';
      script.nonce = 'aem';

      document.head.appendChild(script);
    };

    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadMartech, { timeout: 2000 });
    } else {
      setTimeout(loadMartech, 1000);
    }
  })();
</script>
