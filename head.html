<meta
  http-equiv="Content-Security-Policy"
  content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
  move-to-http-header="true"
>
<meta name="viewport" content="width=device-width, initial-scale=1,  minimal-ui, user-scalable=no"/>
<link rel="preload" href="/fonts/icomoon.woff" as="font" type="font/woff" crossorigin>
<script nonce="aem">
  (() => {
    const globalStyles = document.createElement('link');
    globalStyles.rel = 'stylesheet';
    globalStyles.href = '/styles/styles.css';
    document.head.append(globalStyles);

    let heroAssetsStarted = false;
    const preloadBlockAssets = (name) => {
      const script = document.createElement('script');
      script.src = `/blocks/${name}/${name}.js`;
      script.type = 'module';
      script.nonce = 'aem';
      const style = document.createElement('link');
      style.href = `/blocks/${name}/${name}.css`;
      style.rel = 'stylesheet';
      document.head.append(script, style);
    };
    const preloadHeroAssets = () => {
      if (heroAssetsStarted) return;
      heroAssetsStarted = true;
      preloadBlockAssets('hero');
    };
    const preloadWelcomeBanner = () => {
      const path = window.location.pathname.replace(/\/$/, '') || '/';
      if (!['/', '/en', '/th', '/jp', '/zh'].includes(path)) return;
      preloadBlockAssets('welcome-banner');
    };
    const preloadBlockCss = (href) => {
      if (document.querySelector(`link[href="${href}"]`)) return;
      const style = document.createElement('link');
      style.rel = 'stylesheet';
      style.href = href;
      document.head.append(style);
    };
    const preloadFoldCss = () => {
      if (document.querySelector('.menu-banner')) {
        preloadBlockCss('/blocks/menu-banner/menu-banner.css');
      }
      if (document.querySelector('.news-media, .latest-news')) {
        preloadBlockCss('/styles/components/listing-card.css');
        preloadBlockCss('/blocks/news-media/news-media.css');
      }
    };
    preloadWelcomeBanner();
    preloadFoldCss();

    const promote = () => {
      const hero = document.querySelector('main .hero') || document.querySelector('.hero');
      if (!hero) return false;
      const rows = [...hero.children].slice(1, 8);
      const row = rows.find((item) => item.children[1]?.textContent?.trim() === 'true') || rows[0];
      const pictures = row?.querySelectorAll('picture') || [];
      const isMobile = window.matchMedia('(width <= 47.5rem)').matches;
      const picture = (isMobile ? pictures[1] : pictures[0]) || pictures[0] || pictures[1];
      const img = picture?.querySelector('img');
      if (!img) return false;
      preloadHeroAssets();

      img.loading = 'eager';
      img.setAttribute('loading', 'eager');
      img.fetchPriority = 'high';
      img.setAttribute('fetchpriority', 'high');

      const sources = [...picture.querySelectorAll('source[srcset]')];
      const matched = sources.find((source) => {
        const media = source.getAttribute('media');
        return media && window.matchMedia(media).matches;
      });
      const chosen = matched || sources.find((source) => !source.getAttribute('media'));
      const raw = (chosen?.getAttribute('srcset') || img.getAttribute('src') || '')
        .split(',')[0].trim().split(/\s+/)[0];
      if (!raw) return true;

      const { href } = new URL(raw, document.baseURI);
      const already = [...document.head.querySelectorAll('link[rel="preload"][as="image"]')]
        .some((link) => link.href === href);
      if (already) return true;

      const link = document.createElement('link');
      link.rel = 'preload';
      link.as = 'image';
      link.href = href;
      link.setAttribute('fetchpriority', 'high');
      const type = chosen?.getAttribute('type');
      if (type) link.type = type;
      document.head.append(link);
      return true;
    };

    if (promote()) {
      preloadFoldCss();
      return;
    }
    const observer = new MutationObserver(() => {
      preloadFoldCss();
      if (promote()) observer.disconnect();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  })();
</script>
<script nonce="aem" src="/scripts/aem.js" type="module"></script>

<script nonce="aem">
  (() => {
    if (new URLSearchParams(window.location.search).has('martech')) {
      return;
    }
    const loadMartech = () => {
      const preloadIndex = document.createElement('link');
      preloadIndex.rel = 'preload';
      preloadIndex.as = 'script';
      preloadIndex.crossOrigin = 'anonymous';
      preloadIndex.href = '/plugins/martech/src/index.js';

      const preloadAlloy = document.createElement('link');
      preloadAlloy.rel = 'preload';
      preloadAlloy.as = 'script';
      preloadAlloy.crossOrigin = 'anonymous';
      preloadAlloy.href = '/plugins/martech/src/alloy.min.js';

      document.head.appendChild(preloadIndex);
      document.head.appendChild(preloadAlloy);

      const script = document.createElement('script');
      script.type = 'module';
      script.src = '/scripts/gtm-martech.js';
      script.nonce = 'aem';

      document.head.appendChild(script);
    };

    if ('requestIdleCallback' in window) {
      requestIdleCallback(loadMartech, { timeout: 2000 });
    } else {
      setTimeout(loadMartech, 1000);
    }
  })();
</script>
