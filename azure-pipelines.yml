trigger:
  branches:
    include:
      - dev
      - main
      - stage
      - qa
      - feature/*

pr:
  branches:
    include:
      - dev
      - main
      - stage
      - qa

pool:
  name: PWSM-NPRD
  

stages:

# =========================
# STAGE 1: LINT
# =========================
- stage: Lint
  displayName: "Code Quality Checks"
  jobs:
  - job: LintJob
    steps:
    - task: NodeTool@1
      inputs:
        version: '18.x'

    - script: |
        set -e
        npm install
        echo "✅ Dependencies installed"
      displayName: 'Install dependencies'

    - script: |
        set -e
        npx eslint . --ext .js,.ts,.jsx,.tsx
        echo "✅ ESLint passed"
      displayName: 'Run ESLint'

    - script: |
        npx stylelint "**/*.css" "**/*.scss"
        echo "✅ Stylelint completed"
      displayName: 'Run Stylelint'
      continueOnError: true


# =========================
# STAGE 2: PERFORMANCE
# =========================
- stage: Performance
  displayName: "AEM EDS Validation + Lighthouse"
  dependsOn: Lint
  condition: succeeded()
  jobs:
  - job: LighthouseJob
    steps:

    - task: NodeTool@1
      inputs:
        version: '18.x'

    - script: |
        set -e
        npm install -g @lhci/cli@0.13.x broken-link-checker
        echo "✅ Tools installed"
      displayName: 'Install tools'

    # =========================
    # SET TEST URL
    # =========================
    - script: |
        set -e

        RAW_BRANCH=$(Build.SourceBranchName)
        BRANCH_NAME=$(echo $RAW_BRANCH | sed 's/\//-/g')

        if [ "$BRANCH_NAME" = "main" ]; then
          TEST_URL="https://main--site-prod--bangkok-bank.aem.live/en"

        elif [ "$BRANCH_NAME" = "dev" ]; then
          TEST_URL="https://dev--site-dev--bangkok-bank.aem.live/en"

        elif [ "$BRANCH_NAME" = "qa" ]; then
          TEST_URL="https://qa--site-qa--bangkok-bank.aem.live/en"

        elif [ "$BRANCH_NAME" = "stage" ]; then
          TEST_URL="https://stage--site-stage--bangkok-bank.aem.live/en"

        else
          TEST_URL="https://${BRANCH_NAME}--site-dev--bangkok-bank.aem.page/en"
        fi

        echo "Using URL: $TEST_URL"
        echo "##vso[task.setvariable variable=TEST_URL]$TEST_URL"
        echo "✅ URL resolved"
      displayName: 'Set Test URL'

    # =========================
    # CONFIGURE CHROME
    # =========================
    - script: |
        set -e

        CHROME_PATH=$(which google-chrome || which chromium || which chromium-browser)

        if [ -z "$CHROME_PATH" ]; then
          echo "❌ Chrome not found!"
          exit 1
        fi

        echo "Using Chrome at: $CHROME_PATH"
        echo "##vso[task.setvariable variable=CHROME_PATH]$CHROME_PATH"
        echo "✅ Chrome configured"
      displayName: 'Configure Chrome'

    # =========================
    # CDN WARMUP
    # =========================
    - script: |
        echo "Warming CDN cache..."
        curl -s $(TEST_URL) > /dev/null
        sleep 2
        echo "✅ CDN warmed"
      displayName: 'Warm CDN Cache'

    # =========================
    # CDN HEADER CHECK
    # =========================
    - script: |
        set -e

        HEADERS=$(curl -s -I $(TEST_URL))
        echo "$HEADERS"

        if ! echo "$HEADERS" | grep -qi "cache-control"; then
          echo "❌ Cache-Control header missing"
          exit 1
        fi

        echo "✅ CDN headers validated"
      displayName: 'Validate CDN Headers'

    # =========================
    # SAFE BROKEN LINK CHECK
    # =========================
    - script: |
        echo "Validating URL before broken link check..."

        STATUS=$(curl -s -o /dev/null -w "%{http_code}" $(TEST_URL))

        echo "HTTP Status: $STATUS"

        if [ "$STATUS" != "200" ]; then
          echo "⚠️ URL not accessible ($STATUS), skipping broken link check"
          exit 0
        fi

        for i in 1 2 3; do
          echo "Attempt $i..."
          blc $(TEST_URL) -ro --user-agent "Mozilla/5.0" && break
          sleep 5
        done

        echo "✅ Broken link check completed"
      displayName: 'Check Broken Links'

    # =========================
    # LIGHTHOUSE
    # =========================
    - script: |
        set -e

        lhci collect \
          --url="$(TEST_URL)" \
          --numberOfRuns=2 \
          --settings.chromeFlags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu"

        lhci assert
        lhci upload

        echo "✅ Lighthouse completed"
      displayName: 'Run Lighthouse CI'

    # =========================
    # PUBLISH REPORT
    # =========================
    - task: PublishBuildArtifacts@1
      inputs:
        pathToPublish: '.lighthouseci'
        artifactName: 'lighthouse-report'
      displayName: 'Publish Lighthouse Report'

    # =========================
    # SUMMARY + VALIDATION
    # =========================
    - script: |
        set -e

        SUMMARY_FILE="$(System.DefaultWorkingDirectory)/summary.md"
        FILES=$(find .lighthouseci -name "lhr-*.json")

        echo "## 🚀 Lighthouse Report" > $SUMMARY_FILE
        echo "" >> $SUMMARY_FILE
        echo "| URL | Perf | A11y | SEO | LCP | CLS |" >> $SUMMARY_FILE
        echo "|-----|------|------|-----|-----|-----|" >> $SUMMARY_FILE

        PASS=0

        for file in $FILES; do
          URL=$(jq -r '.finalUrl' "$file")

          PERF=$(jq '.categories.performance.score * 100' "$file")
          A11Y=$(jq '.categories.accessibility.score * 100' "$file")
          SEO=$(jq '.categories.seo.score * 100' "$file")

          LCP=$(jq -r '.audits["largest-contentful-paint"].displayValue' "$file")
          CLS=$(jq -r '.audits["cumulative-layout-shift"].displayValue' "$file")

          echo "| $URL | $PERF | $A11Y | $SEO | $LCP | $CLS |" >> $SUMMARY_FILE

          if (( $(echo "$PERF >= 80" | bc -l) )); then
            PASS=1
          fi
        done

        cat $SUMMARY_FILE
        echo "##vso[task.uploadsummary]$SUMMARY_FILE"

        if [ $PASS -eq 1 ]; then
          echo "🎉 At least one run passed → SUCCESS"
        else
          echo "🚨 All runs below threshold → FAILED"
          exit 1
        fi
      displayName: 'Summary + Validation'