version: 1

indices:
  site-en: &base-site
    include:
      - "/en/**"
    exclude:
      - "/*.json"
      - "/**/*.json"
    target: /en/query-index.json
    properties:
      title:
        select: head > meta[property="og:title"], head > title
        value: |
          attribute(el, 'content') || textContent(el)
      keywords:
        select: head > meta[name="keywords"]
        value: attribute(el, 'content')
      description:
        select: head > meta[name="description"]
        value: attribute(el, 'content')
  site-th:
    <<: *base-site
    include:
      - "/th-TH/**"
    exclude:
      - "/*.json"
      - "/**/*.json"
    target: /th-TH/query-index.json