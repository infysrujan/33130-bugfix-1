    @font-face {
      font-family: BangkokBank-Regular;

      font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: BangkokBank-Medium;
      src: url('../../fonts/BBLSans-medium.woff2') format('woff2'),

      font-family: BangkokBank-Bold;

      --bbl-color-grey-30:            #DBDBDB;
      --bbl-color-grey-40:            #C8C8CC;
      --bbl-color-grey-70:            #78787D;
      --bbl-color-grey-85:            #4E4E4E;

      background: var(--bbl-color-grey-10);
      color: var(--bbl-color-grey-100);
    }

    /* icomoon icon helper */
    [class^="icon-"]::before,
    [class*=" icon-"]::before {
      font-family: icomoon, sans-serif !important;
      font-style: normal; font-weight: normal;
      font-variant: normal; text-transform: none; line-height: 1;
      -webkit-font-smoothing: antialiased;
    }
    .icon-calendar::before { content: "\e912"; }
    .icon-print::before    { content: "\e90e"; }
    .icon-dropdown::before { content: "\e902"; }

    .search-bar {
      background: #002850;
      padding: 12px 0;
      z-index: 5;
      position: relative;
      border: 0 solid rgba(0,0,0,.1);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.75rem;
      padding-inline: 2rem;
    }
    .search-bar label {
      color: var(--bbl-color-white);
      font-family: var(--bbl-font-family-medium);
      font-size: 0.9375rem;
      white-space: nowrap;
    }

    /* custom dropdown */
    .fund-select-wrapper { position: relative; flex: 0 1 22rem; }
    .fund-select-btn {
      width: 100%;
      padding: 0.45rem 2.5rem 0.45rem 0.85rem;
      border: 1.5px solid rgba(255,255,255,0.6);
      border-radius: 4px;
      background: rgba(255,255,255,0.08);
      color: var(--bbl-color-white);
      font-family: var(--bbl-font-family-primary);
      font-size: 0.875rem;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      position: relative;
    }
    .fund-select-btn .icon-dropdown::before {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--bbl-color-white);
      font-size: 0.7rem;
      opacity: 0.85;
    }
    .fund-dropdown {
      position: absolute;
      top: calc(100% + 2px);
      left: 0;
      min-width: 35rem;
      background: var(--bbl-color-white);
      border: 1px solid var(--bbl-color-grey-40);
      border-radius: 0 0 4px 4px;
      max-height: 18rem;
      overflow-y: auto;
      z-index: 1000;
      display: none;
      box-shadow: 0 4px 8px rgba(0,0,0,.12);
      list-style: none;
    }
    .fund-dropdown.open { display: block; }
    .fund-dropdown li {
      padding: 0.6rem 1rem;
      font-family: var(--bbl-font-family-primary);
      font-size: 0.9375rem;
      font-weight: 400;
      cursor: pointer;
      color: var(--bbl-color-grey-100);
      background: transparent;
      border: none;
    }
    .fund-dropdown li:hover { color: var(--bbl-color-active-blue); background: transparent; }
    .fund-dropdown li.active { color: var(--bbl-color-active-blue); background: transparent; font-weight: 400; }

      padding: 0.5rem 1.75rem;
      background: var(--bbl-color-active-blue);
      color: var(--bbl-color-white);
      border: none;
      border-radius: 4px;
      font-family: var(--bbl-font-family-medium);
      font-size: 0.9375rem;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: 0.01em;

      font-size: 2.5rem;
      font-weight: 400;
      color: var(--bbl-color-black);

      font-size: 0.875rem;

    #dp-grid span.disabled { color: var(--bbl-color-grey-40); }

    .fund-prices-dropdown { padding: 0 2rem 2rem; background: var(--bbl-color-white); }

/* ── Build dropdown ──────────────────────────────────────────── */
let selectedFund = null; // { id, name } or null for All Funds
const dropdownEl = document.getElementById('fund-dropdown');
const selectBtn  = document.getElementById('fund-select-btn');

function setSelected(fund) {
  selectedFund = fund;
  selectBtn.childNodes[0].textContent = (fund ? fund.name : 'ALL FUNDS') + ' ';
  dropdownEl.querySelectorAll('li').forEach(l => l.classList.remove('active'));
  dropdownEl.querySelector(`li[data-fund-id="${fund ? fund.id : ''}"]`)?.classList.add('active');
  if (!fund) dropdownEl.querySelector('li[data-fund-id=""]')?.classList.add('active');
  dropdownEl.classList.remove('open');
  selectBtn.setAttribute('aria-expanded', 'false');
}

// "All Funds" option
const allLi = document.createElement('li');
allLi.textContent = 'ALL FUNDS';
allLi.setAttribute('role', 'option');
allLi.setAttribute('data-fund-id', '');
allLi.classList.add('active');
allLi.addEventListener('click', () => setSelected(null));
dropdownEl.appendChild(allLi);

// Per-fund options built from MOCK_FUNDS (available via the fetch mock data defined above)
// They are added after MOCK_FUNDS is defined — see the DOMContentLoaded block below

selectBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = dropdownEl.classList.toggle('open');
  selectBtn.setAttribute('aria-expanded', String(open));
});
document.addEventListener('click', () => {
  dropdownEl.classList.remove('open');
  selectBtn.setAttribute('aria-expanded', 'false');
});

const _realFetch = window.fetch.bind(window);
window.fetch = async (url, opts) => {
  const s = String(url);
  if (s.includes('/api/fundpriceservice/LatestDate'))
    return new Response(JSON.stringify([{ mDate:'2026-05-13T00:00:00' }]), { status:200, headers:{'Content-Type':'application/json'} });
  if (s.includes('/api/fundpriceservice/AllFundsName'))
    return new Response(JSON.stringify(MOCK_ALL_FUNDS_NAME), { status:200, headers:{'Content-Type':'application/json'} });
  if (s.includes('/api/fundpriceservice/GetUpdateInMonth'))
    return new Response(JSON.stringify([{Day:13},{Day:12},{Day:11},{Day:8},{Day:7},{Day:6},{Day:5}]), { status:200, headers:{'Content-Type':'application/json'} });
  if (s.includes('/api/fundpriceservice/FundMinMax'))
    return new Response(JSON.stringify(MOCK_FUND_MINMAX), { status:200, headers:{'Content-Type':'application/json'} });
  if (s.includes('/api/fundpriceservice/FundPrice'))
    return new Response(JSON.stringify(MOCK_FUND_HISTORY), { status:200, headers:{'Content-Type':'application/json'} });
  if (/\/api\/fundpriceservice\/\d{4}$/.test(s))
    return new Response(JSON.stringify(MOCK_FUNDS), { status:200, headers:{'Content-Type':'application/json'} });
  return _realFetch(url, opts);
};

/* ── Calendar picker stub ────────────────────────────────────── */
function attachCalendarPicker({ input, value, fetchEnabledDays, onChange }) {
  const popup = document.getElementById('date-picker-popup');
  const grid  = document.getElementById('dp-grid');
  const label = document.getElementById('dp-month-year');
  let current  = value ? new Date(value) : new Date();
  let selected = current;
  let enabledDays = [];

  const MONTHS = ['January','February','March','April','May','June',
                  'July','August','September','October','November','December'];

  function fmt(d) {
    return `${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  }
  async function loadGrid(y, m) {
    const raw = await fetchEnabledDays({ year:y, month:m }).catch(() => []);
    enabledDays = Array.isArray(raw) ? raw.map(i => i?.Day ?? i?.day ?? i).filter(Number.isInteger) : raw;
    renderGrid(y, m);
  }
  function renderGrid(y, m) {
    label.textContent = `${MONTHS[m]} ${y}`;
    grid.innerHTML = '';
    ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d => {
      const s = document.createElement('span');
      s.className = 'day-name'; s.textContent = d; grid.appendChild(s);
    });
    const first = new Date(y, m, 1).getDay();
    for (let i = 0; i < first; i++) grid.appendChild(document.createElement('span'));
    const days = new Date(y, m + 1, 0).getDate();
    for (let d = 1; d <= days; d++) {
      const s = document.createElement('span');
      s.textContent = d;
      if (enabledDays.includes(d)) {
        s.classList.add('enabled');
        if (selected && selected.getFullYear()===y && selected.getMonth()===m && selected.getDate()===d)
          s.classList.add('selected');
        s.addEventListener('click', () => {
          selected = new Date(y, m, d);
          input.value = fmt(selected);
          popup.classList.remove('open');
          onChange(selected);
        });
      } else { s.classList.add('disabled'); }
      grid.appendChild(s);
    }
  }

  input.value = fmt(selected);
  input.readOnly = true;
  input.addEventListener('click', (e) => {
    e.stopPropagation();
    const rect = input.getBoundingClientRect();
    popup.style.top  = (rect.bottom + 4) + 'px';
    popup.style.left = rect.left + 'px';
    popup.classList.toggle('open');
    if (popup.classList.contains('open')) loadGrid(current.getFullYear(), current.getMonth());
  });
  document.getElementById('dp-prev').addEventListener('click', () => {
    current = new Date(current.getFullYear(), current.getMonth() - 1, 1);
    loadGrid(current.getFullYear(), current.getMonth());
  });
  document.getElementById('dp-next').addEventListener('click', () => {
    current = new Date(current.getFullYear(), current.getMonth() + 1, 1);
    loadGrid(current.getFullYear(), current.getMonth());
  });
  document.addEventListener('click', () => popup.classList.remove('open'));
}

const ALL_FUND_NAMES_URL       = 'https://www.bangkokbank.com/api/fundpriceservice/AllFundsName';
const LATEST_DATE_URL          = 'https://www.bangkokbank.com/api/fundpriceservice/LatestDate';
const GET_UPDATE_IN_MONTH_BASE = 'https://www.bangkokbank.com/api/fundpriceservice/GetUpdateInMonth';
const ALL_FUND_PRICES_URL      = 'https://www.bangkokbank.com/api/fundpriceservice/';
const MAX_FUND_PRICE_HISTORY_YEARS = 3;
let latestMdate  = null;
let allFundsData = [];
let _tableEl     = null;

function isDateOlderThanFundHistoryLimit(d) {
  const today = new Date();
  const cutoff = new Date(today.getFullYear() - MAX_FUND_PRICE_HISTORY_YEARS, today.getMonth(), today.getDate());
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()) < cutoff;
}
function pad2(n) { return String(n).padStart(2,'0'); }
function fmtPath(d) { return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }

async function fetchAllFundPrices(date) {
  const res = await fetch(`${ALL_FUND_PRICES_URL}${date.getFullYear()}`);
  if (!res.ok) throw new Error(`AllFundPrices ${res.status}`);
  const data = await res.json();
  return Array.isArray(data) ? data : [];
}
async function fetchNavEnabledDaysForMonth({ year, month }) {
  const res = await fetch(`${GET_UPDATE_IN_MONTH_BASE}/${year}/${month+1}/0`);
  if (!res.ok) throw new Error(`GetUpdateInMonth ${res.status}`);
  const data = await res.json();
  if (!Array.isArray(data)) return [];
  return data.map(i => i?.day != null ? Number(i.day) : NaN).filter(d => !isNaN(d));
}
function parseLocalDateFromYmd(ymd) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(ymd).trim());
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return (d.getFullYear()===+m[1] && d.getMonth()===+m[2]-1 && d.getDate()===+m[3]) ? d : null;
}
function normalizeHeaderKey(h) { return h.toLowerCase().replace(/[^a-z0-9]/g,''); }
function getLang() {
  const l = document.documentElement.getAttribute('lang');
  return l && l.toLowerCase().startsWith('th') ? 'th' : 'en';
}
const localizedHeaderMap = {
  fundtype:        { en:'mf_cateEng', th:'mf_cateTha' },
  openendfund:     { en:'mf_sEng',    th:'mf_sTha' },
  nav:             'mfr_fNav',
  sellingprice:    'mfr_fBuy',
  redemptionprice: 'mfr_fSel',
  totalnetassets:  'mf_sAUM',
};
function resolveColumnKey(k, lang) {
  const m = localizedHeaderMap[k];
  if (!m) return k;
  return typeof m === 'object' ? m[lang] : m;
}
function buildCategoryOrder(rows, key) {
  const order=[], seen=new Set();
  rows.forEach(r => { if (r[key]!==undefined && !seen.has(r[key])) { order.push(r[key]); seen.add(r[key]); } });
  return order;
}
function groupRowsByCategory(rows, key) {
  return rows.reduce((acc,r) => { if (!acc[r[key]]) acc[r[key]]=[]; acc[r[key]].push(r); return acc; }, {});
}
function clearNonHeaderRows(tbody) { tbody.querySelectorAll('tr:not(.header-row)').forEach(tr => tr.remove()); }

const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function formatBackdate(iso) {
  // "2026-05-06T00:00:00" → "06 May 2026"
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso);
  if (!m) return iso;
  return `${m[3]} ${MONTHS_SHORT[+m[2]-1]} ${m[1]}`;
}

function formatBodyCellText(nk, row, ck) {
  if (nk === 'openendfund') {
    // mf_backdate takes priority; fall back to mfr_dDataDate / mf_dnav
    const rawDate = row.mf_backdate || row.mfr_dDataDate || row.mf_dnav;
    if (rawDate && row[ck] !== undefined) {
      // Compare date portion only against latestMdate (YYYY-MM-DD)
      const datePart = rawDate.split('T')[0];
      if (datePart !== latestMdate) {
        const label = row.mf_backdate ? formatBackdate(rawDate) : rawDate;
        return `${row[ck]} <span class="dnav">${label}</span>`;
      }
    }
    return row[ck] !== undefined ? `${row[ck]}` : '';
  }
  if (ck && row[ck] !== undefined) {
    const v = String(row[ck]);
    const num = parseFloat(v);
    if (!isNaN(num) && Math.abs(num) >= 1000)
      return num.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:4 });
    return v === 'null' ? 'N/A' : v;
  }
  return '';
}

function appendRowFromData(tableElement, dataArray) {
  const lang  = getLang();
  const tbody = tableElement.querySelector('tbody');
  if (!tbody || !Array.isArray(dataArray)) return;

  let headerRow = tbody.querySelector('.header-row');
  if (!headerRow) {
    const first = tbody.querySelector('tr');
    if (first) { headerRow = first; headerRow.classList.add('header-row'); }
  }
  if (!headerRow) return;

  const headers     = [...headerRow.querySelectorAll('td')];
  const categoryKey = lang === 'th' ? 'mf_cateTha' : 'mf_cateEng';
  const order       = buildCategoryOrder(dataArray, categoryKey);
  const groups      = groupRowsByCategory(dataArray, categoryKey);

  clearNonHeaderRows(tbody);

  order.forEach(category => {
    const group = groups[category];
    group.forEach((row, idx) => {
      const tr = document.createElement('tr');
      headers.forEach(hCell => {
        const nk = normalizeHeaderKey(hCell.textContent.trim());
        const ck = resolveColumnKey(nk, lang);
        if (nk === 'fundtype') {
          if (idx === 0) {
            const td = document.createElement('td');
            td.textContent = row[ck] !== undefined ? row[ck] : '';
            td.rowSpan = group.length;
            td.classList.add('merged-fund-type');
            tr.appendChild(td);
          }
          return;
        }
        const td = document.createElement('td');
        td.innerHTML = formatBodyCellText(nk, row, ck);
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  });
}

function filterFunds(data, fund) {
  if (!fund) return data;
  return data.filter(r => r.mf_iNumber === fund.id || r.mf_sEng === fund.name || r.mf_sTha === fund.name);
}

async function refreshTableFromPrices(tableEl, fallback, date) {
  try {
    const prices = await fetch(`${ALL_FUND_PRICES_URL}${date.getFullYear()}`).then(r => r.json());
    allFundsData = Array.isArray(prices) ? prices : fallback;
  } catch { allFundsData = fallback; }
  appendRowFromData(tableEl, filterFunds(allFundsData, selectedFund));
}

function richTextFromRow(row) {
  if (!row) return '';
  const cell = row.querySelector(':scope > div');
  return (cell ?? row).innerHTML.trim();
}

function printFundPricesContent() {
  const section = document.querySelector('.fund-prices-root');
  if (!section) return;
  const clone = section.cloneNode(true);
  clone.querySelectorAll('.fund-prices-print-label').forEach(el => el.remove());
  clone.querySelectorAll('.fund-prices-error-message').forEach(el => el.remove());
  const inp = clone.querySelector('.calendar-input input');
  if (inp) inp.parentNode?.replaceChild(document.createTextNode(inp.value), inp);
  const orig = document.body.innerHTML;
  document.body.innerHTML = clone.outerHTML;
  window.print();
  document.body.innerHTML = orig;
  window.location.reload();
}

    fddBlock.dispatchEvent(new CustomEvent('fund-prices-dropdown:show', {
      detail: { fund: selectedFund, mdate: latestMdate },
    }));
  } else {
    document.querySelector('.page-body').style.display = '';
    fddBlock.dispatchEvent(new CustomEvent('fund-prices-dropdown:hide'));
    if (_tableEl) appendRowFromData(_tableEl, filterFunds(allFundsData, null));
  }
});

/* ── Decorate ────────────────────────────────────────────────── */
async function decorate(block) {
  const doc  = block.ownerDocument;
  const rows = [...block.children];
  const table = block.closest('.fund-prices-wrapper').querySelector('.table');
  if (!table) return;
  table.classList.add('fund-prices-table');
  _tableEl = table;

  let funds = [], calendarDate = new Date();

  const dateLabelHtml  = richTextFromRow(rows[0]);
  const printLabelHtml = richTextFromRow(rows[1]);
  const errorMsgHtml   = richTextFromRow(rows[2]);
  const disclaimerHtml = richTextFromRow(rows[3]);

  block.innerHTML = '';

  const root = doc.createElement('div');
  root.className = 'fund-prices-root';

  const dateLabel = doc.createElement('div');
  dateLabel.className = 'calendar-wrapper';
  dateLabel.innerHTML = dateLabelHtml;

  const printLabel = doc.createElement('div');
  printLabel.className = 'fund-prices-print-label icon-print';
  printLabel.innerHTML = printLabelHtml;

  const errorMessage = doc.createElement('div');
  errorMessage.classList.add('fund-prices-error-message', 'hidden');
  errorMessage.hidden = true;
  errorMessage.setAttribute('role', 'alert');
  errorMessage.innerHTML = errorMsgHtml;

  const disclaimer = doc.createElement('div');
  disclaimer.className = 'fund-prices-disclaimer-text';
  disclaimer.innerHTML = disclaimerHtml;

  try {
    const [namesRes, latestRes] = await Promise.all([fetch(ALL_FUND_NAMES_URL), fetch(LATEST_DATE_URL)]);
    if (latestRes.ok) {
      const lj = await latestRes.json();
      const rawDate = Array.isArray(lj) ? lj[0]?.mDate : lj?.mDate;
      latestMdate = rawDate ? rawDate.split('T')[0] : null;
      const parsed = latestMdate ? parseLocalDateFromYmd(latestMdate) : null;
      if (parsed) calendarDate = parsed;
    }
    if (namesRes.ok) {
      const data = await namesRes.json();
      funds = Array.isArray(data) ? data : [];
    }
  } catch (e) { console.error('fund-prices: init failed', e); }

  const calendarInput = doc.createElement('div');
  const input = doc.createElement('input');
  input.id = 'date-to'; input.type = 'text'; input.name = 'date-to';
  calendarInput.classList.add('calendar-input', 'icon-calendar');
  calendarInput.appendChild(input);
  dateLabel.appendChild(calendarInput);

  attachCalendarPicker({
    input, value: calendarDate,
    fetchEnabledDays: fetchNavEnabledDaysForMonth,
    onChange: (selectedDate) => {
      if (!table) return;
      if (isDateOlderThanFundHistoryLimit(selectedDate)) {
        errorMessage.classList.remove('hidden'); errorMessage.hidden = false; return;
      }
      errorMessage.classList.add('hidden'); errorMessage.hidden = true;
      refreshTableFromPrices(table, funds, selectedDate);
    },
  });

  await refreshTableFromPrices(table, funds, calendarDate);

  const toolbar = doc.createElement('div');
  toolbar.className = 'fund-prices-toolbar';
  toolbar.appendChild(dateLabel);
  toolbar.appendChild(printLabel);

  root.append(toolbar, errorMessage, table, disclaimer);
  block.appendChild(root);
  printLabel.addEventListener('click', (e) => { e.preventDefault(); printFundPricesContent(); });
}

decorate(document.getElementById('fund-prices-block'));
</script>
